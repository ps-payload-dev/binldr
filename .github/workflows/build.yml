name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: ps-payload-dev/sdk
          path: sdk

      - name: Set up PS4 SDK
        working-directory: sdk
        run: |
          sudo apt update
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt install llvm-23 llvm-23-dev clang-23 lld-23 cmake wget xz-utils
          make DESTDIR=${{ runner.tool_cache }}/ps-payload-sdk clean install
          export PS4_PAYLOAD_SDK=${{ runner.tool_cache }}/ps-payload-sdk/ps4
          ./libcxx.sh ps4
          echo PS4_PAYLOAD_SDK=$PS4_PAYLOAD_SDK >> $GITHUB_ENV

      - name: Checkout binldr
        uses: actions/checkout@v4

      - name: Build PS4
        run: make PLATFORM=ps4 clean all

      - name: Upload PS4 build
        uses: actions/upload-artifact@v4
        with:
          name: binldr-ps4
          path: |
            build/binldr.elf
            build/binldr.bin
            build/lib-binldr.a
          if-no-files-found: error
