name: Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout payload SDK
        uses: actions/checkout@v4
        with:
          repository: ps-payload-dev/sdk
          path: sdk

      - name: Set up PS4 payload SDK
        working-directory: sdk
        run: |
          sudo apt update
          sudo apt install clang-18 lld-18 libc++-18-dev
          make DESTDIR=${{ runner.tool_cache }}/ps-payload-sdk clean install
          sdk=${{ runner.tool_cache }}/ps-payload-sdk/ps4
          libcxx_headers=$(find /usr -type f -path '*/include/c++/v1/atomic' -print -quit)
          if [ -z "$libcxx_headers" ]; then
            echo "libc++ headers were not found after installing libc++-18-dev" >&2
            exit 1
          fi
          libcxx_headers=${libcxx_headers%/atomic}
          install -d "$sdk/target/include/c++/v1"
          cp -a "$libcxx_headers/." "$sdk/target/include/c++/v1/"
          echo PS4_PAYLOAD_SDK=${{ runner.tool_cache }}/ps-payload-sdk/ps4 >> $GITHUB_ENV

      - name: Checkout binldr
        uses: actions/checkout@v4

      - name: Build binldr
        run: make all

      - name: Upload binldr
        uses: actions/upload-artifact@v4
        with:
          name: binldr-ps4
          path: |
            build/binldr.elf
            build/binldr.bin
            build/lib-binldr.a
          if-no-files-found: error
